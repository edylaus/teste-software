<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Fornecedor - Módulo Fornecedor</title>
  <link rel="stylesheet" href="css/sidebar.css">
  <link rel="stylesheet" href="css/fornecedor-cadastro.css">
</head>
<body>
  <div class="app-shell">
    <aside class="app-sidebar">
      <div class="app-sidebar__brand">Módulo Fornecedor</div>
      <nav class="app-sidebar__nav">
        <a href="inicio.html" class="app-sidebar__link"><span class="app-sidebar__icon">🏠</span> Início</a>
        <a href="fornecedor-listagem.html" class="app-sidebar__link ativo"><span class="app-sidebar__icon">👥</span> Fornecedores</a>
        <a href="configuracoes.html" class="app-sidebar__link"><span class="app-sidebar__icon">⚙️</span> Configurações</a>
      </nav>
      <div class="app-sidebar__user">
        <div class="app-sidebar__avatar"></div>
        <div>
          <div class="app-sidebar__user-name">Usuário Logado</div>
          <div class="app-sidebar__user-email">usuario@empresa.com</div>
        </div>
      </div>
    </aside>

    <main class="app-main">
      <div class="form-container">
        <a href="fornecedor-listagem.html" class="voltar">← Voltar</a>
        <h1>Cadastrar fornecedor</h1>
        <p class="subtitulo">Preencha os dados abaixo para cadastrar um novo fornecedor.</p>

        <form id="form-fornecedor" novalidate>
          <h2 class="secao-titulo">Dados do fornecedor</h2>
          <div class="linha-3">
            <div>
              <label for="razaoSocial">Razão Social *</label>
              <input type="text" id="razaoSocial" name="razaoSocial" required>
            </div>
            <div>
              <label for="nomeFantasia">Nome Fantasia</label>
              <input type="text" id="nomeFantasia" name="nomeFantasia">
            </div>
            <div>
              <label for="cnpj">CNPJ *</label>
              <input type="text" id="cnpj" name="cnpj" inputmode="numeric" maxlength="18" placeholder="00.000.000/0000-00" required>
            </div>
          </div>

          <label for="categoria">Categoria *</label>
          <input type="text" id="categoria" name="categoria" list="lista-categorias" required>
          <datalist id="lista-categorias">
            <option value="Comercio">
            <option value="Tecnologia">
            <option value="Materiais de Escritorio">
            <option value="Servicos">
            <option value="Distribuicao">
          </datalist>

          <h2 class="secao-titulo">Endereço</h2>
          <div class="linha-2">
            <div>
              <label for="cep">CEP *</label>
              <input type="text" id="cep" name="cep" inputmode="numeric" maxlength="9" placeholder="00000-000" required>
            </div>
            <div>
              <label for="rua">Rua *</label>
              <input type="text" id="rua" name="rua" placeholder="Digite o endereço" required>
            </div>
          </div>

          <div class="linha-3">
            <div>
              <label for="numero">Número *</label>
              <input type="text" id="numero" name="numero" required>
            </div>
            <div>
              <label for="complemento">Complemento</label>
              <input type="text" id="complemento" name="complemento">
            </div>
            <div>
              <label for="bairro">Bairro *</label>
              <input type="text" id="bairro" name="bairro" required>
            </div>
          </div>

          <div class="linha-2">
            <div>
              <label for="cidade">Cidade</label>
              <input type="text" id="cidade" name="cidade">
            </div>
            <div>
              <label for="uf">Estado</label>
              <select id="uf" name="uf">
                <option value="">Selecione o estado</option>
                <option>AC</option><option>AL</option><option>AP</option><option>AM</option>
                <option>BA</option><option>CE</option><option>DF</option><option>ES</option>
                <option>GO</option><option>MA</option><option>MT</option><option>MS</option>
                <option>MG</option><option>PA</option><option>PB</option><option>PR</option>
                <option>PE</option><option>PI</option><option>RJ</option><option>RN</option>
                <option>RS</option><option>RO</option><option>RR</option><option>SC</option>
                <option>SP</option><option>SE</option><option>TO</option>
              </select>
            </div>
          </div>

          <h2 class="secao-titulo">Contato</h2>
          <div class="linha-2">
            <div>
              <label for="email">E-mail *</label>
              <input type="email" id="email" name="email" required>
            </div>
            <div>
              <label for="telefone">Telefone *</label>
              <input type="text" id="telefone" name="telefone" placeholder="(00) 00000-0000" required>
            </div>
          </div>

          <p id="mensagem" class="mensagem" role="alert"></p>

          <div class="botoes">
            <a href="fornecedor-listagem.html" class="botao-cancelar">Cancelar</a>
            <button type="submit">Cadastrar fornecedor</button>
          </div>
        </form>
      </div>
    </main>
  </div>
  <script src="js/fornecedor-cadastro.js"></script>
</body>
</html>
